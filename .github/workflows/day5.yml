name: Security Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Security_Compliance_workshop-dhiraj/day5/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Security_Compliance_workshop-dhiraj/day5/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd Security_Compliance_workshop-dhiraj/day5
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  bandit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r Security_Compliance_workshop-dhiraj/day5 -f html -o bandit-report.html || true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.html

  semgrep:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config auto Security_Compliance_workshop-dhiraj/day5 --json --output semgrep-report.json || true
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  trivy-deps:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4      
      - name: Run Trivy File System Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          format: json
          output: Security_Compliance_workshop-dhiraj/day5/trivy-deps-report.json
          ignore-unfixed: true
          vuln-type: "os,library"
        continue-on-error: true
      - name: Upload Trivy deps report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-deps-report
          path: Security_Compliance_workshop-dhiraj/day5/trivy-deps-report.json

  checkov:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        continue-on-error: true
        run: |
          pip install checkov
          checkov -d Security_Compliance_workshop-dhiraj/day5 --output json > checkov-report.json
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json

  docker-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t flask-demo ./Security_Compliance_workshop-dhiraj/day5

      - name: Scan Docker image with Trivy
        continue-on-error: true
        run: |
          trivy image flask-demo --format json > trivy-docker-report.json
      - name: Upload Docker scan report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-docker-report.json

  gitleaks:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        continue-on-error: true
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 -o gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source Security_Compliance_workshop-dhiraj/day5 --report-path gitleaks-report.json --no-banner
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  zap:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start Flask app
        run: |
          cd Security_Compliance_workshop-dhiraj/day5
          nohup python app.py &

      - name: Wait for app to start
        run: sleep 10

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:5000'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
